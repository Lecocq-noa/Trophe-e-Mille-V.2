<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concours – Léa & Léo</title>
<style>
:root{color-scheme:dark;--bg:#0b0b10;--fg:#f4f4f8;--mut:#9a9aab;--pink:#ff4f93;--blue:#3d8bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{height:100dvh;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
#island{align-self:center;margin:6px 0 6px;background:#000;border:1px solid #2a2a35;border-radius:60px;padding:8px 12px 8px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 30px #000a;flex:none}
#bar{--big:48px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:0 14px}
#ttl{display:flex;align-items:center;gap:.3em;justify-self:start;font-size:var(--big);font-weight:800;color:#fff;white-space:nowrap}
#ttl img{height:1.15em;width:auto;flex:none}
#dt{justify-self:end;font-size:var(--big);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
#ph{font-size:calc(var(--big)*.6);font-weight:800;color:#8fd3ff;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
#ph:empty{display:none}
#gt{font-size:var(--big);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
#island button{width:min(64px,8vh);height:min(64px,8vh);min-width:40px;min-height:40px;border-radius:50%;border:0;background:#22222c;color:var(--fg);font-size:22px;cursor:pointer}
#island #go{width:auto;padding:0 22px;border-radius:32px;background:#fff;color:#000;font-weight:700;font-size:20px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px max(10px,env(safe-area-inset-bottom,0px));min-height:0;overflow:hidden}
.side{--c:var(--pink);border:2px solid var(--c);border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#0b0b10),#0b0b10 70%);display:flex;flex-direction:column;padding:10px 14px;min-width:0;min-height:0;overflow:hidden}
.side.leo{--c:var(--blue)}
.head{display:flex;justify-content:space-between;align-items:center;color:var(--c);font-weight:800;font-size:clamp(18px,3vw,28px);letter-spacing:2px}
.head small{color:var(--mut);font-weight:600;font-size:14px;letter-spacing:0}
.gap{width:min(92px,12vh);min-width:58px;aspect-ratio:1;border:2px solid currentColor;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(20px,3vh);font-weight:800;letter-spacing:0;line-height:1.1;white-space:nowrap;background:#00000066;font-variant-numeric:tabular-nums}
.gap i{font-style:normal;font-size:.5em;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.title{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(16px,2.6vw,26px);font-weight:600;line-height:1.25;padding:8px 4px;overflow:auto}
.note{background:color-mix(in srgb,var(--c) 28%,transparent);border:1px solid var(--c);border-radius:12px;padding:6px 10px;text-align:center;font-size:clamp(12px,min(1.8vw,2.4vh),18px);margin-bottom:6px;max-height:17vh;overflow:hidden;flex:none}
.note:empty{display:none}
.time{flex:none;text-align:center;font-size:clamp(44px,min(13vw,17vh),150px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.time.low{color:#ff5a5a}
.bar{flex:none;height:8px;background:#ffffff18;border-radius:6px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0}
.ctl{flex:none;display:flex;justify-content:center;gap:10px;margin-bottom:8px}
.ctl button{flex:1;max-width:90px;height:min(52px,7vh);min-height:38px;border-radius:14px;border:1px solid var(--c);background:#00000055;color:var(--fg);font-size:22px;cursor:pointer}
.ctl button.p{background:var(--c);color:#000}
.next{background:#00000088;border:1px dashed var(--c);border-radius:14px;flex:none;max-height:22vh;overflow:hidden;padding:10px 16px;font-size:clamp(14px,min(3.2vw,3.6vh),32px);line-height:1.2;color:var(--mut)}
.next b{color:var(--c);display:block;font-size:0.7em;letter-spacing:2px;text-transform:uppercase}
@media (max-width:700px){#bar{grid-template-columns:1fr 1fr}#island{grid-column:1/-1;order:3;justify-self:center}}
@media (max-width:560px){#island{padding:8px 10px 8px 20px;gap:10px}#island button{width:44px;height:44px;font-size:18px}.next{padding:10px;font-size:15px}.next b{font-size:12px}main{gap:6px;padding:0 6px 6px}.side{padding:8px;border-radius:16px}.ctl button{height:44px;font-size:18px}}
</style>
</head>

function goPhase(n,run){if(n===PH)return;SAVE[PH]={g:G.rem,s:Object.fromEntries(Object.keys(S).map(k=>[k,{i:S[k].i,rem:S[k].rem}]))};PH=n;const sv=SAVE[n];G.rem=sv?sv.g:(n===1?9000:2100);G.run=!!run;for(const k in S){const p=S[k];p.t=mk(n===1?RAW[k]:RAW2[k],n===1?9000:2100);p.i=sv?sv.s[k].i:0;p.rem=sv?sv.s[k].rem:p.t[0].d;p.run=!!run;p.suf=null;p.el.dataset.k="";p.el.dataset.f=""}document.getElementById("ph").textContent=n===2?"Prod. froid":"";fitBar()}
document.getElementById("pl").onclick=()=>goPhase(1,G.run);document.getElementById("pr").onclick=()=>goPhase(2,G.run);
function draw(k){const p=S[k],c=p.t[p.i],nx=p.t[p.i+1],el=p.el;
if(!el.dataset.ok){el.dataset.ok=1;el.innerHTML=`<div class="head"><span>${p.name}</span><div class="gap"><b></b><i></i></div><small></small></div><div class="title"></div><div class="note"></div><div class="time"></div><div class="bar"><i></i></div><div class="ctl"><button data-a="prev" title="Objectif précédent">⏮</button><button data-a="play" class="p"></button><button data-a="rst" title="Recommencer cette étape">↺</button><button data-a="next" title="Objectif suivant">⏭</button></div><div class="next"></div>`;
el.onclick=e=>{const a=e.target.closest("button")?.dataset.a;if(a)act(k,a)}}
const q=s=>el.querySelector(s);
q("small").textContent=`Étape ${p.i+1}/${p.t.length}`;
if(!p.suf){let a=0;p.suf=p.t.map(()=>0);for(let j=p.t.length-1;j>=0;j--){p.suf[j]=a;a+=p.t[j].d}}
const df=Math.round(G.rem-(p.rem+p.suf[p.i])),g=q(".gap");g.style.color=df>0?"#3ddc84":df<0?"#ff5a5a":"#9a9aab";g.firstChild.textContent=(df>0?"+":df<0?"−":"")+fmt(Math.abs(df));g.lastChild.textContent=df>0?"avance":df<0?"retard":"pile";
if(el.dataset.k!==String(p.i)){el.dataset.k=p.i;const T=q(".title");T.innerHTML="<span></span>";T.firstChild.textContent=c.t;fit(T)}
q(".note").textContent=c.n;
const tm=q(".time");tm.textContent=fmt(p.rem);tm.classList.toggle("low",p.rem<=10&&c.d>0);
q(".bar i").style.width=(c.d?100*(1-p.rem/c.d):100)+"%";
q('[data-a="play"]').textContent=p.run?"⏸":"▶";
q(".next").innerHTML=nx?`<b>Étape suivante · ${fmt(nx.d)}</b>${nx.t}`:`<b>Dernière étape</b>Fin du concours`;
if(el.dataset.f!==String(p.i)){el.dataset.f=p.i;fitBox(q(".note"));fitBox(q(".next"))}}
function act(k,a){const p=S[k];
if(a==="play")p.run=!p.run;
if(a==="rst")p.rem=p.t[p.i].d;
if(a==="next"&&p.i<p.t.length-1){p.i++;p.rem=p.t[p.i].d}
if(a==="prev"&&p.i>0){p.i--;p.rem=p.t[p.i].d}
draw(k)}
let last=Date.now();
setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;
if(G.run){G.rem=Math.max(0,G.rem-dt);if(!G.rem){if(PH===1){goPhase(2,true);beep("lea")}else G.run=false}}
document.getElementById("gt").textContent=fmt(G.rem,PH===1);document.getElementById("pl").style.opacity=PH===1?.3:1;document.getElementById("pr").style.opacity=PH===2?.3:1;
for(const k in S){const p=S[k];if(p.run){p.rem-=dt;let ch=0;
while(p.rem<=0&&p.i<p.t.length-1){p.i++;p.rem+=p.t[p.i].d;ch=1}
if(p.rem<=0){p.rem=0;p.run=false;ch=1}
if(ch)beep(k)}
draw(k)}},200);
document.getElementById("go").onclick=()=>{try{ac=ac||new AudioContext()}catch(e){}G.run=true;for(const k in S)S[k].run=true;try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(e){}};
document.getElementById("gp").onclick=()=>{G.run=!G.run};
document.getElementById("gr").onclick=()=>{delete SAVE[PH];const s0=PH===1?9000:2100,R=PH===1?RAW:RAW2;G.rem=s0;G.run=false;for(const k in S){const p=S[k];p.t=mk(R[k],s0);p.i=0;p.rem=p.t[0].d;p.run=false;p.suf=null;p.el.dataset.k="";p.el.dataset.f=""}fitBar()};
function fitBar(){const b=document.getElementById("bar");let f=Math.min(innerWidth*.04,innerHeight*.075,72);b.style.setProperty("--big",f+"px");while(b.scrollWidth>b.clientWidth+1&&f>12){f-=1;b.style.setProperty("--big",f+"px")}}
fitBar();
for(const k in S)draw(k);
addEventListener("resize",()=>{fitBar();for(const k in S){S[k].el.dataset.k="";S[k].el.dataset.f="";draw(k)}});
</script>
</body>
</html>
